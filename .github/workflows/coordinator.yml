name: Coordinator

# Runs Auti's thinking loop. Times are UTC (GitHub has no time zones):
#   04:17 UTC daily               = 05:17 Lisbon in summer, 04:17 in winter (overnight study)
#   07:23, 12:23, 17:23 UTC       = stand-up refreshes at the start, middle and end of the working day, weekdays
#                                   (was every 2 hours; three a day cut the coordinator's API spend by about 45%)
# Each refresh also lets Auti take its small automatic steps, so work keeps moving between your visits.
# Odd minutes on purpose: on-the-hour schedules are the most delayed on GitHub.
# keepalive.yml stops GitHub pausing this schedule after 60 days without a commit.
on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '23 7,12,17 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Which run
        type: choice
        options: [nightly, standup]
        default: nightly

# Never two runs at once; a late run waits instead of overlapping.
concurrency:
  group: coordinator
  cancel-in-progress: false

permissions:
  contents: read
  issues: write          # only to open (or comment on) one issue when a scheduled run fails, so the owner hears about it

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      JARVIS_QUIET: '1'          # logs are public: never print the brief itself
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JARVIS_MODEL: ${{ vars.JARVIS_MODEL || 'claude-sonnet-5-5' }}
      # Each agent learns its model from what you approve and dismiss (src/models.js): JARVIS_MODEL is the
      # stronger model, Haiku the cheaper one. Setting a per-agent variable pins that agent instead.
      AUTI_COORDINATOR_MODEL: ${{ vars.AUTI_COORDINATOR_MODEL }}
      SYNAUT_LEADS_MODEL: ${{ vars.SYNAUT_LEADS_MODEL }}
      SYNAUT_RETENTION_MODEL: ${{ vars.SYNAUT_RETENTION_MODEL }}
      AUTI_ACCOUNTS_MODEL: ${{ vars.AUTI_ACCOUNTS_MODEL }}
      AUTI_REPORT_MODEL: ${{ vars.AUTI_REPORT_MODEL }}
      JARVIS_TIMEZONE: Europe/Lisbon
      # Reads each project's latest push. The built-in token sees this repo and public ones;
      # add a SYNAUT_GITHUB_TOKEN secret (read-only, fine-grained) to include your other private repos.
      GITHUB_TOKEN: ${{ secrets.SYNAUT_GITHUB_TOKEN || github.token }}
      # The company CRM, read before each run as Auti's own CRM user. Optional; leave unset to skip.
      CRM_API_URL: ${{ secrets.CRM_API_URL }}
      CRM_EMAIL: ${{ secrets.CRM_EMAIL }}
      CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
    steps:
      - name: Check secrets are set
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Secret DATABASE_URL is not set"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Secret ANTHROPIC_API_KEY is not set"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 4 * * *" ]; then
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=standup" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply any new migrations
        run: node src/migrate.js
      - name: Run coordinator
        run: node src/run.js "${{ steps.mode.outputs.mode }}"
      # Then draft follow-ups for clients due for contact. No call to Claude when nobody is due,
      # and at most one draft waits per client. Drafts wait on the owner; nothing is ever sent from here.
      - name: Retention agent
        run: node src/run.js retention
      # Overdue invoices and renewals from the CRM become drafts on the Approvals tab. Skipped without the CRM.
      - name: Accounts agent
        continue-on-error: true
        run: node src/run.js accounts
      # Once a day, after the overnight run: look for businesses that need what the company sells.
      # At most 8 web searches a run, which took about 12 minutes on the first run (SYNAUT_LEADS_SEARCHES). Research only; it never contacts anyone.
      # A failure here never fails the run. Switch it off from the Leads tab.
      - name: Leads agent
        if: steps.mode.outputs.mode == 'nightly'
        continue-on-error: true
        timeout-minutes: 15          # web research is slow (about 12 minutes for 8 searches); a slow run is cut here, never the whole job
        run: node src/run.js leads
      # Mondays the weekly report, the 1st the monthly one. Saved in the database (Documents tab); nothing is printed.
      - name: Reports
        if: steps.mode.outputs.mode == 'nightly'
        continue-on-error: true
        run: node src/run.js report
      # A failed run tells the owner: one open issue, commented on by later failures. GitHub notifies on new issues and
      # comments. The text is generic (the repository is public): no names, no figures, only the link to the run.
      - name: Tell the owner a run failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OPEN=$(gh issue list --repo "${{ github.repository }}" --label auti-run-failed --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh label create auti-run-failed --repo "${{ github.repository }}" --color B98B2F --description "A scheduled Auti run failed" 2>/dev/null || true
            gh issue create --repo "${{ github.repository }}" --label auti-run-failed --title "A scheduled Auti run failed" \
              --body "The scheduled run did not finish: $RUN_URL. Open the run to see which step failed. Close this issue once it is fixed; the next failure opens a new one."
          fi
